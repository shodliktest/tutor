<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Test Yechish</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EEF0FF;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --acc:#6C3FE8;--acc2:#C040C8;--border:rgba(108,63,232,.12);
  --green:#059669;--red:#ef4444;--yellow:#d97706;
  --grad:linear-gradient(135deg,#6C3FE8,#C040C8);
  --shadow:0 4px 20px rgba(108,63,232,.12);
  --radius:14px;
}
[data-theme=dark]{
  --bg:#0d0820;--card:#140d28;--text:#e8e0ff;--text2:#9ca3af;--text3:#6b7280;
  --border:rgba(108,63,232,.22);
}
body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;background:var(--bg);color:var(--text);overflow-x:hidden}

/* ── SCREENS ── */
#screen-start,#screen-quiz,#screen-result{display:none;animation:fadeIn .3s ease}
#screen-start.active,#screen-quiz.active,#screen-result.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;background:var(--card);border-bottom:1px solid var(--border);
  box-shadow:0 1px 8px rgba(108,63,232,.07)}
.tb-brand{font-family:'Unbounded',sans-serif;font-size:.95rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.tb-r{display:flex;align-items:center;gap:.5rem}
.ibtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);
  background:var(--card);cursor:pointer;font-size:.88rem;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.ibtn:hover{background:rgba(108,63,232,.08)}

/* ── TIMER ── */
.timer-bar{position:fixed;top:52px;left:0;right:0;z-index:99;height:4px;background:rgba(108,63,232,.12)}
.timer-fill{height:100%;background:var(--grad);transition:width .9s linear;width:100%}
.timer-badge{position:fixed;top:60px;right:1rem;z-index:100;
  background:var(--card);border:1.5px solid var(--border);border-radius:99px;
  padding:.28rem .75rem;font-size:.78rem;font-weight:800;
  font-family:'Unbounded',sans-serif;display:flex;align-items:center;gap:.35rem;
  box-shadow:0 2px 10px rgba(0,0,0,.08)}
.timer-badge.warn{border-color:#f59e0b;color:#d97706}
.timer-badge.danger{border-color:#ef4444;color:#ef4444;animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ── CONTENT ── */
.page{padding:70px 1rem 2rem;max-width:640px;margin:0 auto}

/* ── START CARD ── */
.start-card{background:var(--card);border-radius:20px;padding:2rem 1.5rem;
  border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;margin-top:1rem}
.start-ico{width:70px;height:70px;border-radius:20px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  margin:0 auto 1.1rem;box-shadow:0 8px 24px rgba(108,63,232,.3)}
.start-title{font-family:'Unbounded',sans-serif;font-size:1.15rem;font-weight:900;margin-bottom:.3rem}
.start-sub{font-size:.78rem;color:var(--text3);margin-bottom:1.5rem}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.5rem;text-align:left}
.info-item{background:rgba(108,63,232,.05);border:1px solid var(--border);
  border-radius:12px;padding:.7rem .9rem}
.info-label{font-size:.65rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.info-val{font-size:.92rem;font-weight:800;margin-top:.12rem}

/* ── PROGRESS ── */
.prog-wrap{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:.85rem;
  display:flex;align-items:center;gap:.8rem}
.prog-bar-bg{flex:1;height:8px;background:rgba(108,63,232,.1);border-radius:99px;overflow:hidden}
.prog-bar{height:100%;background:var(--grad);border-radius:99px;transition:width .4s ease}
.prog-txt{font-size:.78rem;font-weight:800;font-family:'Unbounded',sans-serif;white-space:nowrap}

/* ── QUESTION CARD ── */
.q-card{background:var(--card);border:1.5px solid var(--border);
  border-radius:20px;padding:1.4rem 1.25rem 1.1rem;
  box-shadow:var(--shadow);margin-bottom:1rem;
  animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  color:var(--acc);margin-bottom:.75rem;display:flex;align-items:center;gap:.35rem}
.q-text{font-size:1rem;font-weight:700;line-height:1.55;margin-bottom:1.1rem}

/* ── OPTIONS ── */
.options{display:flex;flex-direction:column;gap:.52rem}
.opt{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem;
  border-radius:12px;border:2px solid var(--border);background:var(--bg);
  cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none}
.opt:hover{border-color:rgba(108,63,232,.4);background:rgba(108,63,232,.04)}
.opt.selected{border-color:var(--acc);background:rgba(108,63,232,.08);
  box-shadow:0 0 0 3px rgba(108,63,232,.12)}
.opt.correct{border-color:var(--green)!important;background:rgba(5,150,105,.08)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}
.opt-letter{width:32px;height:32px;border-radius:8px;border:2px solid var(--border);
  background:var(--card);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;font-family:'Unbounded',sans-serif;
  transition:all .2s}
.opt.selected .opt-letter{border-color:var(--acc);background:var(--acc);color:#fff}
.opt.correct .opt-letter{border-color:var(--green)!important;background:var(--green)!important;color:#fff!important}
.opt.wrong .opt-letter{border-color:var(--red)!important;background:var(--red)!important;color:#fff!important}
.opt-text{font-size:.9rem;font-weight:600;flex:1}

/* ── TRUE/FALSE ── */
.tf-wrap{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tf-btn{padding:1.1rem;border-radius:14px;border:2px solid var(--border);
  background:var(--bg);cursor:pointer;transition:all .2s;text-align:center;
  font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.tf-btn:hover{border-color:rgba(108,63,232,.4);background:rgba(108,63,232,.04)}
.tf-btn.selected{border-color:var(--acc);background:rgba(108,63,232,.08)}
.tf-btn.correct{border-color:var(--green)!important;background:rgba(5,150,105,.08)!important}
.tf-btn.wrong{border-color:var(--red)!important;background:rgba(239,68,68,.08)!important}

/* ── TEXT INPUT ── */
.text-inp{width:100%;padding:.85rem 1rem;border-radius:12px;
  border:2px solid var(--border);background:var(--bg);
  font-family:inherit;font-size:.95rem;font-weight:600;color:var(--text);
  outline:none;transition:border-color .2s}
.text-inp:focus{border-color:var(--acc)}
.text-inp.correct-inp{border-color:var(--green)!important}
.text-inp.wrong-inp{border-color:var(--red)!important}

/* ── FEEDBACK ── */
.feedback{border-radius:12px;padding:.85rem 1rem;margin-top:.85rem;
  font-size:.85rem;font-weight:600;display:flex;align-items:flex-start;gap:.55rem;
  animation:fadeIn .25s ease}
.feedback.f-ok{background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.25);color:#065f46}
.feedback.f-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#991b1b}
[data-theme=dark] .feedback.f-ok{color:#6ee7b7}
[data-theme=dark] .feedback.f-err{color:#fca5a5}
.feedback-ico{font-size:1.1rem;flex-shrink:0;margin-top:.05rem}

/* ── NEXT BTN ── */
.next-btn{width:100%;margin-top:.85rem;padding:.95rem;border-radius:14px;
  border:none;background:var(--grad);color:#fff;font-family:inherit;
  font-size:.9rem;font-weight:800;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  box-shadow:0 4px 14px rgba(108,63,232,.3)}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(108,63,232,.4)}
.next-btn:disabled{opacity:.5;pointer-events:none}

/* ── RESULT ── */
.result-hero{background:var(--grad);border-radius:24px;padding:2rem 1.5rem;
  text-align:center;color:#fff;margin-bottom:1rem;position:relative;overflow:hidden}
.result-hero::before{content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='29' stroke='rgba(255,255,255,.05)' fill='none'/%3E%3C/svg%3E") center/60px;
  opacity:.4}
.result-score{font-family:'Unbounded',sans-serif;font-size:3rem;font-weight:900;line-height:1}
.result-label{font-size:.85rem;opacity:.85;margin-top:.35rem;font-weight:600}
.result-badge{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;
  border-radius:99px;border:2px solid rgba(255,255,255,.3);
  font-size:.78rem;font-weight:800;margin-top:.75rem}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:1rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:.8rem .5rem;text-align:center}
.stat-val{font-family:'Unbounded',sans-serif;font-size:1.1rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:.6rem;color:var(--text3);text-transform:uppercase;
  letter-spacing:.04em;font-weight:700;margin-top:.12rem}

/* ── ANALYSIS ACCORDION ── */
.analysis-wrap{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:1rem}
.analysis-hdr{padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:800;font-size:.88rem;border-bottom:1px solid var(--border)}
.analysis-hdr:hover{background:rgba(108,63,232,.04)}
.analysis-body{padding:.75rem .85rem;display:flex;flex-direction:column;gap:.5rem}

.a-item{border-radius:10px;padding:.72rem .85rem;border:1.5px solid transparent;
  display:flex;align-items:flex-start;gap:.6rem}
.a-item.ok{background:rgba(5,150,105,.06);border-color:rgba(5,150,105,.18)}
.a-item.err{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.15)}
.a-num{width:24px;height:24px;border-radius:6px;flex-shrink:0;
  font-size:.7rem;font-weight:900;font-family:'Unbounded',sans-serif;
  display:flex;align-items:center;justify-content:center}
.a-item.ok .a-num{background:rgba(5,150,105,.15);color:var(--green)}
.a-item.err .a-num{background:rgba(239,68,68,.12);color:var(--red)}
.a-info{flex:1;min-width:0}
.a-q{font-size:.8rem;font-weight:700;margin-bottom:.22rem;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.a-ans{font-size:.72rem;color:var(--text2);font-weight:600}
.a-expl{font-size:.7rem;color:var(--text3);margin-top:.2rem;font-style:italic}

/* ── BUTTONS ── */
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap}
.btn{padding:.75rem 1.1rem;border-radius:12px;border:none;font-family:inherit;
  font-size:.85rem;font-weight:800;cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 3px 12px rgba(108,63,232,.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text2);border:1.5px solid var(--border)}
.btn-ghost:hover{background:rgba(108,63,232,.07);border-color:rgba(108,63,232,.3)}
.btn-full{width:100%;justify-content:center}

/* ── MATCH / ORDER UI ── */
.match-wrap{display:flex;flex-direction:column;gap:.45rem}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center}
.match-left{padding:.65rem .8rem;border-radius:10px;
  background:rgba(108,63,232,.07);border:1.5px solid rgba(108,63,232,.18);
  font-size:.85rem;font-weight:700;text-align:center}
.match-select{padding:.62rem .5rem;border-radius:10px;border:2px solid var(--border);
  background:var(--bg);font-family:inherit;font-size:.85rem;font-weight:600;
  color:var(--text);cursor:pointer;width:100%;outline:none;transition:border-color .2s}
.match-select:focus{border-color:var(--acc)}
.match-arrow{color:var(--text3);font-size:.9rem;text-align:center}

.order-chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.65rem}
.order-chip{padding:.45rem .85rem;border-radius:8px;
  background:var(--card);border:2px solid var(--border);
  font-size:.82rem;font-weight:700;cursor:grab;user-select:none;
  transition:all .2s;display:flex;align-items:center;gap:.35rem}
.order-chip:hover{border-color:rgba(108,63,232,.4);background:rgba(108,63,232,.06)}
.order-chip.dragging{opacity:.4;transform:scale(.95)}
.order-chip.drag-over{border-color:var(--acc);background:rgba(108,63,232,.1)}
.order-slots{display:flex;flex-direction:column;gap:.4rem}
.order-slot{padding:.6rem .85rem;border-radius:10px;border:2px dashed rgba(108,63,232,.25);
  background:rgba(108,63,232,.03);font-size:.82rem;color:var(--text3);
  min-height:40px;display:flex;align-items:center;transition:all .2s}
.order-slot.filled{border-color:var(--acc);background:rgba(108,63,232,.07);color:var(--text)}

/* ── THEME TOGGLE ── */
.theme-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:.25rem}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(108,63,232,.2);border-radius:99px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-brand">🎓 Test</div>
  <div class="tb-r">
    <div class="timer-badge" id="timer-badge" style="display:none">⏱ <span id="timer-txt">00:00</span></div>
    <button class="ibtn theme-btn" id="theme-btn">🌙</button>
    <button class="ibtn" onclick="cancelQuiz()" title="Chiqish">✕</button>
  </div>
</div>
<div class="timer-bar" id="timer-bar" style="display:none">
  <div class="timer-fill" id="timer-fill"></div>
</div>

<div class="page">

<!-- ══════════════════════ START SCREEN ══════════════════════ -->
<div id="screen-start">
  <div class="start-card">
    <div class="start-ico">📝</div>
    <div class="start-title" id="s-title">Test nomi</div>
    <div class="start-sub" id="s-sub">Boshlashdan oldin ma'lumotlarni tekshiring</div>
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">📋 Savollar</div>
        <div class="info-val" id="s-count">—</div>
      </div>
      <div class="info-item">
        <div class="info-label">⏱ Vaqt</div>
        <div class="info-val" id="s-time">Cheksiz</div>
      </div>
      <div class="info-item">
        <div class="info-label">🎯 O'tish bali</div>
        <div class="info-val" id="s-pass">60%</div>
      </div>
      <div class="info-item">
        <div class="info-label">📁 Fan</div>
        <div class="info-val" id="s-cat">—</div>
      </div>
    </div>
    <button class="next-btn" onclick="startQuiz()">🚀 Boshlash</button>
    <button class="btn btn-ghost btn-full" style="margin-top:.6rem" onclick="cancelQuiz()">← Orqaga</button>
  </div>
</div>

<!-- ══════════════════════ QUIZ SCREEN ══════════════════════ -->
<div id="screen-quiz">
  <!-- Progress -->
  <div class="prog-wrap">
    <div class="prog-bar-bg"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
    <div class="prog-txt" id="prog-txt">0/0</div>
    <button class="ibtn" onclick="cancelQuiz()" style="flex-shrink:0;font-size:.75rem;width:28px;height:28px" title="To'xtatish">✕</button>
  </div>

  <!-- Question -->
  <div class="q-card" id="q-card">
    <div class="q-label">
      <span id="q-type-icon">❓</span>
      <span id="q-type-lbl">Savol</span>
    </div>
    <div class="q-text" id="q-text">...</div>
    <div id="q-body"><!-- options / input --></div>
    <div id="q-feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()" disabled>
      Keyingisi <span id="next-arrow">→</span>
    </button>
  </div>
</div>

<!-- ══════════════════════ RESULT SCREEN ══════════════════════ -->
<div id="screen-result">
  <div class="result-hero">
    <div id="res-emoji" style="font-size:2.5rem;margin-bottom:.5rem">🏆</div>
    <div class="result-score" id="res-pct">—%</div>
    <div class="result-label" id="res-label">Natija</div>
    <div class="result-badge" id="res-badge">✅ Muvaffaqiyatli</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="st-correct">0</div>
      <div class="stat-lbl">✅ To'g'ri</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-wrong">0</div>
      <div class="stat-lbl">❌ Xato</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="st-time">0:00</div>
      <div class="stat-lbl">⏱ Vaqt</div>
    </div>
  </div>

  <!-- Analysis accordion -->
  <div class="analysis-wrap">
    <div class="analysis-hdr" onclick="toggleAnalysis()">
      <span>🔍 Batafsil tahlil</span>
      <span id="analysis-arrow">▼</span>
    </div>
    <div class="analysis-body" id="analysis-body" style="display:none"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="restartQuiz()">🔄 Qaytadan</button>
    <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="cancelQuiz()">🏠 Asosiy</button>
  </div>
</div>

</div><!-- /page -->

<script>
/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
let TEST = null;
let questions = [];
let currentIdx = 0;
let userAnswers = {};  // {idx: answer}
let startTime = 0;
let timerInterval = null;
let totalSeconds = 0;
let elapsedSeconds = 0;
let answered = false;

/* ═══════════════════════════════════
   THEME
═══════════════════════════════════ */
const TH = {
  get(){ return localStorage.getItem('qz_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') },
  set(t){ document.documentElement.setAttribute('data-theme',t); localStorage.setItem('qz_theme',t);
    document.getElementById('theme-btn').textContent = t==='dark'?'☀️':'🌙' },
  toggle(){ this.set(this.get()==='dark'?'light':'dark') }
};
TH.set(TH.get());
document.getElementById('theme-btn').onclick = () => TH.toggle();

/* ═══════════════════════════════════
   INIT — Streamlit dan ma'lumot qabul qilish
═══════════════════════════════════ */
function initTest(testData) {
  TEST = testData;
  questions = testData.questions || [];

  // Start screen
  document.getElementById('s-title').textContent  = testData.title || 'Test';
  document.getElementById('s-sub').textContent    = testData.category ? `📁 ${testData.category}` : '';
  document.getElementById('s-count').textContent  = questions.length + ' ta';
  document.getElementById('s-time').textContent   = testData.time_limit > 0 ? testData.time_limit + ' daqiqa' : 'Cheksiz';
  document.getElementById('s-pass').textContent   = (testData.passing_score || 60) + '%';
  document.getElementById('s-cat').textContent    = testData.category || '—';

  showScreen('start');
}

/* ═══════════════════════════════════
   SCREENS
═══════════════════════════════════ */
function showScreen(name) {
  ['start','quiz','result'].forEach(s => {
    const el = document.getElementById('screen-' + s);
    el.classList.toggle('active', s === name);
  });
}

/* ═══════════════════════════════════
   START
═══════════════════════════════════ */
function startQuiz() {
  currentIdx = 0;
  userAnswers = {};
  answered = false;
  startTime = Date.now();
  totalSeconds = (TEST.time_limit || 0) * 60;
  elapsedSeconds = 0;

  if (totalSeconds > 0) {
    document.getElementById('timer-bar').style.display = 'block';
    document.getElementById('timer-badge').style.display = 'flex';
    startTimer();
  }

  showScreen('quiz');
  renderQuestion();
}

function startTimer() {
  clearInterval(timerInterval);
  const fill = document.getElementById('timer-fill');
  const badge = document.getElementById('timer-badge');
  timerInterval = setInterval(() => {
    elapsedSeconds++;
    const remain = totalSeconds - elapsedSeconds;
    if (remain <= 0) { clearInterval(timerInterval); finishQuiz(); return; }
    const pct = (remain / totalSeconds) * 100;
    fill.style.width = pct + '%';
    const m = Math.floor(remain/60), s = remain%60;
    document.getElementById('timer-txt').textContent = `${m}:${s.toString().padStart(2,'0')}`;
    badge.className = 'timer-badge' + (pct < 25 ? ' danger' : pct < 50 ? ' warn' : '');
  }, 1000);
}

/* ═══════════════════════════════════
   RENDER QUESTION
═══════════════════════════════════ */
function renderQuestion() {
  answered = false;
  const q = questions[currentIdx];
  const total = questions.length;

  // Progress
  const pct = (currentIdx / total) * 100;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-txt').textContent = `${currentIdx + 1}/${total}`;

  // Next btn
  const btn = document.getElementById('next-btn');
  btn.disabled = true;
  btn.textContent = currentIdx === total - 1 ? '✅ Yakunlash' : 'Keyingisi →';

  // Clear feedback
  document.getElementById('q-feedback').innerHTML = '';

  // Type label
  const typeInfo = {
    multiple_choice: {icon:'⭕', label:'Ko\'p tanlov'},
    multi_select:    {icon:'☑️', label:'Ko\'p javobli'},
    true_false:      {icon:'✅', label:'Ha / Yo\'q'},
    fill_blank:      {icon:'✍️', label:'Bo\'sh joy'},
    text_input:      {icon:'📝', label:'Matnli javob'},
    matching:        {icon:'🔗', label:'Moslashtirish'},
    ordering:        {icon:'🔢', label:'Tartiblash'},
  }[q.type] || {icon:'❓', label:'Savol'};

  document.getElementById('q-type-icon').textContent = typeInfo.icon;
  document.getElementById('q-type-lbl').textContent  = typeInfo.label;
  document.getElementById('q-text').textContent      = q.question || q.text || '';

  // Animate card
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'slideUp .25s ease';

  // Render body
  const body = document.getElementById('q-body');
  body.innerHTML = '';

  if (q.type === 'multiple_choice') {
    renderMCQ(body, q);
  } else if (q.type === 'multi_select') {
    renderMSQ(body, q);
  } else if (q.type === 'true_false') {
    renderTF(body, q);
  } else if (q.type === 'fill_blank' || q.type === 'text_input') {
    renderText(body, q);
  } else if (q.type === 'matching') {
    renderMatch(body, q);
  } else if (q.type === 'ordering') {
    renderOrder(body, q);
  } else {
    renderMCQ(body, q);
  }
}

/* ── MCQ ── */
function renderMCQ(body, q) {
  const letters = ['A','B','C','D','E','F','G','H'];
  const opts = q.options || [];
  const wrap = document.createElement('div');
  wrap.className = 'options';
  opts.forEach((opt, i) => {
    const text = String(opt).replace(/^[A-Za-z]\)\s*/, '').trim();
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.idx = i;
    div.innerHTML = `<div class="opt-letter">${letters[i]||i+1}</div><div class="opt-text">${esc(text)}</div>`;
    div.onclick = () => {
      if (answered) return;
      wrap.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
      div.classList.add('selected');
      document.getElementById('next-btn').disabled = false;
      userAnswers[currentIdx] = letters[i];
    };
    wrap.appendChild(div);
  });
  body.appendChild(wrap);
}

/* ── MSQ (multi-select) ── */
function renderMSQ(body, q) {
  const letters = ['A','B','C','D','E','F','G','H'];
  const opts = q.options || [];
  const selected = new Set();
  const wrap = document.createElement('div');
  wrap.className = 'options';
  const hint = document.createElement('div');
  hint.style = 'font-size:.73rem;color:var(--text3);margin-bottom:.55rem;font-weight:600';
  hint.textContent = '☑️ Bir nechta to\'g\'ri javob bo\'lishi mumkin';
  body.appendChild(hint);
  opts.forEach((opt, i) => {
    const text = String(opt).replace(/^[A-Za-z]\)\s*/, '').trim();
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.idx = i;
    div.innerHTML = `<div class="opt-letter">${letters[i]||i+1}</div><div class="opt-text">${esc(text)}</div>`;
    div.onclick = () => {
      if (answered) return;
      if (selected.has(i)) { selected.delete(i); div.classList.remove('selected'); }
      else { selected.add(i); div.classList.add('selected'); }
      userAnswers[currentIdx] = [...selected].map(x => letters[x]).sort();
      document.getElementById('next-btn').disabled = selected.size === 0;
    };
    wrap.appendChild(div);
  });
  body.appendChild(wrap);
}

/* ── TRUE/FALSE ── */
function renderTF(body, q) {
  const wrap = document.createElement('div');
  wrap.className = 'tf-wrap';
  [['Ha', '✅'], ["Yo'q", '❌']].forEach(([label, icon]) => {
    const btn = document.createElement('button');
    btn.className = 'tf-btn';
    btn.innerHTML = `<span style="font-size:1.5rem">${icon}</span>${label}`;
    btn.onclick = () => {
      if (answered) return;
      wrap.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      userAnswers[currentIdx] = label;
      document.getElementById('next-btn').disabled = false;
    };
    wrap.appendChild(btn);
  });
  body.appendChild(wrap);
}

/* ── TEXT INPUT ── */
function renderText(body, q) {
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'text-inp';
  inp.placeholder = 'Javobingizni yozing...';
  inp.oninput = () => {
    userAnswers[currentIdx] = inp.value.trim();
    document.getElementById('next-btn').disabled = !inp.value.trim();
  };
  inp.onkeydown = (e) => { if (e.key === 'Enter' && inp.value.trim()) nextQ(); };
  body.appendChild(inp);
  setTimeout(() => inp.focus(), 100);
}

/* ── MATCHING ── */
function renderMatch(body, q) {
  const pairs = q.correct || {};
  const keys = Object.keys(pairs);
  const vals = Object.values(pairs);
  const shuffledVals = [...vals].sort(() => Math.random() - .5);
  const wrap = document.createElement('div');
  wrap.className = 'match-wrap';
  userAnswers[currentIdx] = {};

  keys.forEach((key, i) => {
    const row = document.createElement('div');
    row.className = 'match-row';
    const left = document.createElement('div');
    left.className = 'match-left';
    left.textContent = key;
    const arrow = document.createElement('div');
    arrow.className = 'match-arrow';
    arrow.textContent = '→';
    const sel = document.createElement('select');
    sel.className = 'match-select';
    sel.innerHTML = '<option value="">— tanlang —</option>';
    shuffledVals.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
    sel.onchange = () => {
      userAnswers[currentIdx][key] = sel.value;
      const allFilled = keys.every(k => userAnswers[currentIdx][k]);
      document.getElementById('next-btn').disabled = !allFilled;
    };
    row.appendChild(left); row.appendChild(arrow); row.appendChild(sel);
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

/* ── ORDERING ── */
function renderOrder(body, q) {
  const correct = q.correct || [];
  const shuffled = [...correct].sort(() => Math.random() - .5);
  let order = [];
  userAnswers[currentIdx] = [];

  const chipsWrap = document.createElement('div');
  chipsWrap.className = 'order-chips';
  const slotsWrap = document.createElement('div');
  slotsWrap.className = 'order-slots';

  const label1 = document.createElement('div');
  label1.style = 'font-size:.72rem;color:var(--text3);font-weight:700;margin-bottom:.4rem';
  label1.textContent = '📦 Quyidagi elementlarni to\'g\'ri tartibga soling:';
  body.appendChild(label1);

  // Chips
  shuffled.forEach((item, i) => {
    const chip = document.createElement('div');
    chip.className = 'order-chip';
    chip.textContent = item.replace(/^\d+[\.\)]\s*/, '');
    chip.dataset.val = item;
    chip.onclick = () => {
      if (order.length < correct.length) {
        order.push(item);
        chip.style.opacity = '.35';
        chip.style.pointerEvents = 'none';
        userAnswers[currentIdx] = [...order];
        updateSlots(slotsWrap, order, correct.length, chipsWrap, shuffled);
        document.getElementById('next-btn').disabled = order.length < correct.length;
      }
    };
    chipsWrap.appendChild(chip);
  });

  // Slots
  for (let i = 0; i < correct.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'order-slot';
    slot.dataset.idx = i;
    slot.textContent = `${i+1}. (bo\'sh)`;
    slotsWrap.appendChild(slot);
  }

  body.appendChild(chipsWrap);
  const label2 = document.createElement('div');
  label2.style = 'font-size:.72rem;color:var(--text3);font-weight:700;margin:.6rem 0 .4rem';
  label2.textContent = '✅ Tartib:';
  body.appendChild(label2);
  body.appendChild(slotsWrap);
}

function updateSlots(slotsWrap, order, total, chipsWrap, shuffled) {
  const slots = slotsWrap.querySelectorAll('.order-slot');
  slots.forEach((slot, i) => {
    if (order[i]) {
      slot.textContent = `${i+1}. ` + order[i].replace(/^\d+[\.\)]\s*/, '');
      slot.classList.add('filled');
      // Add undo button
      slot.innerHTML = `<span style="flex:1">${i+1}. ${esc(order[i].replace(/^\d+[\.\)]\s*/, ''))}</span>
        <button onclick="undoSlot(${i})" style="background:none;border:none;cursor:pointer;
          color:var(--text3);font-size:.85rem;padding:0 .2rem">✕</button>`;
    } else {
      slot.textContent = `${i+1}. (bo'sh)`;
      slot.classList.remove('filled');
    }
  });
  // Store refs for undo
  window._orderState = { order, chipsWrap, shuffled, slotsWrap };
}

window.undoSlot = function(idx) {
  if (!window._orderState) return;
  const { order, chipsWrap, shuffled, slotsWrap } = window._orderState;
  const removed = order.splice(idx, 1)[0];
  userAnswers[currentIdx] = [...order];
  // Re-enable chip
  const chips = chipsWrap.querySelectorAll('.order-chip');
  chips.forEach(chip => {
    if (chip.dataset.val === removed) {
      chip.style.opacity = '1';
      chip.style.pointerEvents = 'auto';
    }
  });
  updateSlots(slotsWrap, order, order.length + 1, chipsWrap, shuffled);
  document.getElementById('next-btn').disabled = true;
};

/* ═══════════════════════════════════
   NEXT — CHECK ANSWER
═══════════════════════════════════ */
function nextQ() {
  if (!answered) {
    checkAnswer();
    return;
  }
  currentIdx++;
  if (currentIdx >= questions.length) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function checkAnswer() {
  answered = true;
  const q = questions[currentIdx];
  const userAns = userAnswers[currentIdx];
  let isCorrect = false;
  let correctDisplay = '';

  if (q.type === 'multiple_choice' || q.type === 'true_false') {
    const correctRaw = String(q.correct || '').trim();
    const cLetter = correctRaw.match(/^([A-Za-z])/)?.[1]?.toUpperCase() || correctRaw;
    isCorrect = String(userAns||'').toUpperCase() === cLetter.toUpperCase();
    correctDisplay = q.options ? q.options.find((o,i) => {
      const letters = ['A','B','C','D','E','F'];
      return letters[i] === cLetter;
    }) || correctRaw : correctRaw;

    // Highlight options
    const opts = document.querySelectorAll('#q-body .opt');
    const letters = ['A','B','C','D','E','F','G','H'];
    opts.forEach((opt, i) => {
      if (letters[i] === cLetter) opt.classList.add('correct');
      else if (letters[i] === String(userAns||'').toUpperCase() && !isCorrect) opt.classList.add('wrong');
    });
    const tfBtns = document.querySelectorAll('#q-body .tf-btn');
    if (tfBtns.length) {
      tfBtns.forEach(btn => {
        if (btn.textContent.includes('Ha') && q.correct && String(q.correct).includes('Ha')) btn.classList.add('correct');
        else if (btn.textContent.includes("Yo'q") && q.correct && String(q.correct).includes("Yo'q")) btn.classList.add('correct');
        if (!isCorrect && btn.classList.contains('selected') && !btn.classList.contains('correct')) btn.classList.add('wrong');
      });
      isCorrect = userAns === (String(q.correct).includes('Ha') ? 'Ha' : "Yo'q");
    }

  } else if (q.type === 'multi_select') {
    const correctList = Array.isArray(q.correct) ? q.correct : [];
    const letters = ['A','B','C','D','E','F'];
    const correctLetters = correctList.map((c,_) => {
      const m = String(c).match(/^([A-Za-z])/);
      return m ? m[1].toUpperCase() : '';
    }).filter(Boolean);
    const userList = Array.isArray(userAns) ? userAns : [];
    isCorrect = JSON.stringify(userList.sort()) === JSON.stringify(correctLetters.sort());
    correctDisplay = correctLetters.join(', ');

  } else if (q.type === 'fill_blank' || q.type === 'text_input') {
    const correct = String(q.correct || '').toLowerCase().trim();
    const user    = String(userAns || '').toLowerCase().trim();
    const accepted = (q.accepted_answers || []).map(a => a.toLowerCase().trim());
    isCorrect = user === correct || accepted.includes(user);
    correctDisplay = q.correct || '';
    const inp = document.querySelector('#q-body .text-inp');
    if (inp) {
      inp.readOnly = true;
      inp.classList.add(isCorrect ? 'correct-inp' : 'wrong-inp');
    }

  } else if (q.type === 'matching') {
    const correct = q.correct || {};
    let allRight = true;
    Object.entries(userAns || {}).forEach(([k, v]) => {
      if (correct[k] !== v) allRight = false;
    });
    isCorrect = allRight && Object.keys(correct).length === Object.keys(userAns || {}).length;
    correctDisplay = Object.entries(correct).map(([k,v]) => `${k} → ${v}`).join(', ');

  } else if (q.type === 'ordering') {
    const correct = q.correct || [];
    const user    = userAns || [];
    isCorrect = JSON.stringify(user) === JSON.stringify(correct);
    correctDisplay = correct.map(c => c.replace(/^\d+[\.\)]\s*/, '')).join(' → ');
  }

  // Store result
  if (!userAnswers._results) userAnswers._results = [];
  userAnswers._results.push({ idx: currentIdx, isCorrect, userAns, correctDisplay });

  // Feedback
  showFeedback(isCorrect, correctDisplay, q.explanation);

  // Next btn
  const btn = document.getElementById('next-btn');
  btn.disabled = false;
  btn.textContent = currentIdx === questions.length - 1 ? '✅ Natijani ko\'rish' : 'Keyingisi →';
}

function showFeedback(isOk, correct, expl) {
  const el = document.getElementById('q-feedback');
  let html = `<div class="feedback ${isOk ? 'f-ok' : 'f-err'}">
    <div class="feedback-ico">${isOk ? '✅' : '❌'}</div>
    <div>
      <div style="font-weight:800;margin-bottom:.2rem">${isOk ? 'To\'g\'ri!' : 'Xato!'}</div>`;
  if (!isOk && correct) html += `<div style="font-size:.78rem">🎯 To'g'ri javob: <b>${esc(String(correct))}</b></div>`;
  const cleanExpl = (expl||'').trim();
  if (cleanExpl && !['Izoh kiritilmagan.','Izoh yo\'q','Izoh kiritilmagan'].includes(cleanExpl)) {
    html += `<div style="font-size:.75rem;margin-top:.3rem;opacity:.85">💡 ${esc(cleanExpl)}</div>`;
  }
  html += `</div></div>`;
  el.innerHTML = html;
}

/* ═══════════════════════════════════
   FINISH
═══════════════════════════════════ */
function finishQuiz() {
  clearInterval(timerInterval);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const results = userAnswers._results || [];
  const correct = results.filter(r => r.isCorrect).length;
  const total   = questions.length;
  const pct     = Math.round(correct / total * 100);
  const pass    = pct >= (TEST.passing_score || 60);

  // Result screen
  document.getElementById('res-emoji').textContent  = pass ? '🏆' : '😔';
  document.getElementById('res-pct').textContent    = pct + '%';
  document.getElementById('res-label').textContent  = pass ? 'Siz testdan o\'tdingiz!' : 'Testdan o\'tolmadingiz';
  document.getElementById('res-badge').textContent  = pass ? '✅ Muvaffaqiyatli' : '❌ Yiqildi';
  document.getElementById('res-badge').style.background = pass ? 'rgba(5,150,105,.15)' : 'rgba(239,68,68,.15)';

  document.getElementById('st-correct').textContent = correct;
  document.getElementById('st-wrong').textContent   = total - correct;
  const m = Math.floor(elapsed/60), s = elapsed%60;
  document.getElementById('st-time').textContent    = `${m}:${s.toString().padStart(2,'0')}`;

  // Analysis
  buildAnalysis(results);

  document.getElementById('timer-bar').style.display   = 'none';
  document.getElementById('timer-badge').style.display = 'none';
  showScreen('result');

  // Streamlit ga natija yuborish
  sendToStreamlit({
    type: 'quiz_result',
    test_id: TEST.test_id,
    correct, total, pct, pass,
    elapsed, results
  });
}

function buildAnalysis(results) {
  const body = document.getElementById('analysis-body');
  body.innerHTML = '';
  results.forEach(r => {
    const q = questions[r.idx];
    const qText = q.question || q.text || '';
    const div = document.createElement('div');
    div.className = 'a-item ' + (r.isCorrect ? 'ok' : 'err');
    div.innerHTML = `
      <div class="a-num">${r.idx + 1}</div>
      <div class="a-info">
        <div class="a-q">${esc(qText)}</div>
        ${!r.isCorrect ? `<div class="a-ans">🎯 To'g'ri: <b>${esc(String(r.correctDisplay||''))}</b></div>` : ''}
        ${(q.explanation||'').trim() && !['Izoh kiritilmagan.','Izoh yo\'q','Izoh kiritilmagan'].includes((q.explanation||'').trim()) ?
          `<div class="a-expl">💡 ${esc(q.explanation)}</div>` : ''}
      </div>`;
    body.appendChild(div);
  });
}

function toggleAnalysis() {
  const body = document.getElementById('analysis-body');
  const arrow = document.getElementById('analysis-arrow');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'flex';
  arrow.textContent = open ? '▼' : '▲';
}

function restartQuiz() {
  showScreen('start');
}

function cancelQuiz() {
  clearInterval(timerInterval);
  sendToStreamlit({ type: 'cancel' });
}

/* ═══════════════════════════════════
   STREAMLIT BRIDGE
═══════════════════════════════════ */
function sendToStreamlit(data) {
  try {
    window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setComponentValue', value: data }, '*');
  } catch(e) {}
}

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'quiz:init') {
    initTest(e.data.test);
  }
});

/* ═══════════════════════════════════
   HELPERS
═══════════════════════════════════ */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Streamlit ready
sendToStreamlit({ type: 'ready' });

// Demo mode — Streamlit yuklash uchun test
window.DEMO_MODE = false;
</script>
