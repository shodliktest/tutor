<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TestPro Web App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#EEF0FF,#F5F0FF);
  display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.card{background:#fff;border-radius:24px;padding:2rem;text-align:center;
  box-shadow:0 8px 32px rgba(108,63,232,.12);max-width:400px;width:100%}
h1{font-size:1.4rem;font-weight:900;
  background:linear-gradient(135deg,#6C3FE8,#C040C8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:.5rem}
p{color:#6b7280;font-size:.9rem;margin-bottom:1.5rem}
.btn{display:block;width:100%;padding:.85rem;border-radius:14px;border:none;
  cursor:pointer;font-size:.95rem;font-weight:700;font-family:inherit;
  margin-bottom:.6rem;text-decoration:none;
  background:linear-gradient(135deg,#6C3FE8,#C040C8);color:#fff}
.btn.sec{background:#EEF0FF;color:#6C3FE8}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:3rem;margin-bottom:.5rem">🎓</div>
  <h1>TestPro Web App</h1>
  <p>Bu sahifa Telegram bot orqali ochilishi kerak.<br>
  Botga o'tish uchun quyidagi tugmani bosing.</p>
  <a href="https://t.me/YOUR_BOT_USERNAME" class="btn">🤖 Botga o'tish</a>
  <button onclick="window.Telegram?.WebApp?.close()" class="btn sec">← Yopish</button>
</div>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
</script>
</body>
</html>
