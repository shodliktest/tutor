<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TestPro — Batafsil Tahlil</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EEF0FF;--card:#fff;--text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --acc:#6C3FE8;--acc2:#C040C8;--border:rgba(108,63,232,.1);--shadow:0 2px 10px rgba(108,63,232,.07);
  --green:#059669;--red:#ef4444;--yellow:#d97706;
}
[data-theme=dark]{
  --bg:#0d0820;--card:#140d28;--text:#e8e0ff;--text2:#9ca3af;--text3:#6b7280;
  --border:rgba(108,63,232,.2);--shadow:0 2px 10px rgba(0,0,0,.3)
}
body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;background:var(--bg);color:var(--text)}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;height:54px;z-index:500;
  display:flex;align-items:center;justify-content:space-between;padding:0 1rem;
  background:var(--bg);border-bottom:1px solid var(--border)}
.logo{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:900;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ibtn{width:34px;height:34px;border-radius:99px;border:none;cursor:pointer;font-size:.88rem;
  background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;color:var(--text)}
[data-theme=dark] .ibtn{background:rgba(255,255,255,.1)}

/* SCORE HERO */
.hero{margin:70px 1rem 1rem;background:var(--card);border-radius:20px;
  padding:1.5rem 1rem;text-align:center;border:1.5px solid var(--border);
  box-shadow:var(--shadow)}
.sc-circle{width:100px;height:100px;border-radius:50%;margin:0 auto .8rem;
  display:flex;align-items:center;justify-content:center;
  font-family:'Unbounded',sans-serif;font-size:1.5rem;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sc-circle.pass{background:linear-gradient(135deg,#059669,#10b981)}
.sc-circle.fail{background:linear-gradient(135deg,#ef4444,#f97316)}
.hero-title{font-family:'Unbounded',sans-serif;font-size:.95rem;font-weight:900;margin-bottom:.3rem}
.hero-sub{font-size:.8rem;color:var(--text2);margin-bottom:1rem}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.stat{background:var(--bg);border-radius:12px;padding:.6rem .4rem;text-align:center}
.stat-v{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:900;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-l{font-size:.6rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;
  font-weight:700;margin-top:.1rem}

/* PROGRESS BAR */
.prog-wrap{margin:.8rem 0 0}
.prog-bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.prog-fill{height:100%;border-radius:99px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));transition:width .6s ease}

/* FILTER TABS */
.filter-wrap{display:flex;gap:.35rem;padding:.8rem 1rem .4rem;overflow-x:auto}
.filter-wrap::-webkit-scrollbar{display:none}
.ftab{padding:.32rem .75rem;border-radius:99px;font-size:.72rem;font-weight:700;
  cursor:pointer;border:1.5px solid var(--border);background:var(--card);
  color:var(--text2);transition:all .2s;white-space:nowrap;font-family:inherit;flex-shrink:0}
.ftab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  border-color:transparent;box-shadow:0 3px 12px rgba(108,63,232,.28)}

/* QUESTION CARDS */
.page{padding:0 1rem 5rem}
.q-card{background:var(--card);border-radius:16px;margin-bottom:.7rem;
  border:1.5px solid var(--border);overflow:hidden;transition:all .2s}
.q-card.correct{border-color:rgba(5,150,105,.3)}
.q-card.wrong{border-color:rgba(239,68,68,.3)}
.q-card.skip{border-color:var(--border);opacity:.7}

.q-hdr{display:flex;align-items:center;gap:.55rem;padding:.85rem .9rem .6rem;cursor:pointer}
.q-num{width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:800;color:#fff}
.q-card.correct .q-num{background:#059669}
.q-card.wrong .q-num{background:#ef4444}
.q-card.skip .q-num{background:#9ca3af}

.q-text-preview{flex:1;font-size:.84rem;font-weight:700;color:var(--text);line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q-badge{font-size:.65rem;font-weight:700;padding:.2rem .45rem;border-radius:6px;
  flex-shrink:0;white-space:nowrap}
.q-card.correct .q-badge{background:rgba(5,150,105,.12);color:#059669}
.q-card.wrong .q-badge{background:rgba(239,68,68,.1);color:#ef4444}
.q-card.skip .q-badge{background:rgba(156,163,175,.1);color:#9ca3af}

.q-body{padding:0 .9rem .9rem;display:none}
.q-card.open .q-body{display:block}
.q-full-text{font-size:.86rem;font-weight:600;color:var(--text);margin-bottom:.7rem;line-height:1.45}

.ans-row{display:flex;align-items:flex-start;gap:.4rem;padding:.45rem .6rem;
  border-radius:10px;margin-bottom:.3rem;font-size:.8rem;font-weight:600}
.ans-row.user-ans{background:rgba(108,63,232,.08);border:1.5px solid rgba(108,63,232,.2);color:var(--acc)}
.ans-row.correct-ans{background:rgba(5,150,105,.08);border:1.5px solid rgba(5,150,105,.25);color:#059669}
.ans-row.wrong-ans{background:rgba(239,68,68,.07);border:1.5px solid rgba(239,68,68,.2);color:#ef4444}

.expl-box{background:rgba(108,63,232,.05);border:1.5px solid rgba(108,63,232,.12);
  border-radius:10px;padding:.55rem .7rem;margin-top:.5rem;
  font-size:.76rem;color:var(--text2);line-height:1.5}
.expl-box strong{color:var(--acc)}

/* BACK BTN */
.back-btn{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border:none;border-radius:14px;
  padding:.75rem 2rem;font-size:.9rem;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 4px 16px rgba(108,63,232,.35);z-index:100}

/* LOADING / EMPTY */
.loading{text-align:center;padding:3rem 1rem}
.sp{width:36px;height:36px;border:3px solid rgba(108,63,232,.15);border-top-color:var(--acc);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty-ico{font-size:2.5rem;margin-bottom:.5rem}
</style>
</head>
<body>

<div class="nav">
  <span class="logo">📊 Tahlil</span>
  <button class="ibtn" id="tbtn">🌙</button>
</div>

<div id="hero" class="hero" style="display:none">
  <div class="sc-circle" id="sc-circle">—</div>
  <div class="hero-title" id="hero-title">Test nomi</div>
  <div class="hero-sub" id="hero-sub">Natija</div>
  <div class="stats-row">
    <div class="stat"><div class="stat-v" id="st-correct">—</div><div class="stat-l">✅ To'g'ri</div></div>
    <div class="stat"><div class="stat-v" id="st-wrong">—</div><div class="stat-l">❌ Xato</div></div>
    <div class="stat"><div class="stat-v" id="st-time">—</div><div class="stat-l">⏱ Vaqt</div></div>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<div class="filter-wrap" id="filter-wrap" style="display:none">
  <button class="ftab on" onclick="setFilter('all',this)">Barchasi</button>
  <button class="ftab" onclick="setFilter('correct',this)">✅ To'g'ri</button>
  <button class="ftab" onclick="setFilter('wrong',this)">❌ Xato</button>
  <button class="ftab" onclick="setFilter('skip',this)">⏭ O'tkazilgan</button>
</div>

<div class="page" id="q-list">
  <div class="loading"><div class="sp"></div><p style="color:var(--text2);font-size:.85rem">Yuklanmoqda...</p></div>
</div>

<button class="back-btn" onclick="goBack()">← Yopish</button>

<script>
// ── THEME ──────────────────────────────────────────
const TH={
  get(){return localStorage.getItem('tp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')},
  set(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('tp_theme',t);
    const b=document.getElementById('tbtn');if(b)b.textContent=t==='dark'?'☀️':'🌙'},
  toggle(){this.set(this.get()==='dark'?'light':'dark')}
};
TH.set(TH.get());
document.getElementById('tbtn').onclick=()=>TH.toggle();

// ── TELEGRAM WEB APP ──────────────────────────────
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

function goBack(){
  if(tg){tg.close();}else{history.back();}
}

// ── STATE ─────────────────────────────────────────
let ALL_Q=[]; // {status:'correct'|'wrong'|'skip', ...}
let CUR_FILTER='all';

function setFilter(f,el){
  CUR_FILTER=f;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  renderList();
}

function renderList(){
  const list=CUR_FILTER==='all'?ALL_Q:ALL_Q.filter(q=>q.status===CUR_FILTER);
  const wrap=document.getElementById('q-list');
  if(!list.length){
    wrap.innerHTML=`<div class="empty"><div class="empty-ico">🎯</div><p>Bu filtr bo'yicha savol yo'q</p></div>`;
    return;
  }
  wrap.innerHTML=list.map((q,localIdx)=>renderCard(q,localIdx)).join('');
}

function renderCard(q,idx){
  const statusClass=q.status;
  const icon=q.status==='correct'?'✅':q.status==='wrong'?'❌':'⏭';
  const badge=q.status==='correct'?`+${q.pts||1} ball`:q.status==='wrong'?'Xato':\"O'tkazildi\";
  const qText=esc(q.text||'Savol');

  let body='';
  // User answer
  if(q.status!=='skip'){
    const isOk=q.status==='correct';
    body+=`<div class="ans-row ${isOk?'correct-ans':'wrong-ans'}">${isOk?'✅':'❌'} Sizning javobingiz: <b>${esc(String(q.userAnswer||'—'))}</b></div>`;
    if(!isOk){
      body+=`<div class="ans-row correct-ans">✅ To'g'ri javob: <b>${esc(String(q.correctAnswer||'—'))}</b></div>`;
    }
  } else {
    body+=`<div class="ans-row user-ans">⏭ Bu savol o'tkazib yuborildi</div>`;
    body+=`<div class="ans-row correct-ans">✅ To'g'ri javob: <b>${esc(String(q.correctAnswer||'—'))}</b></div>`;
  }
  if(q.explanation){
    body+=`<div class="expl-box"><strong>💡 Izoh:</strong> ${esc(q.explanation)}</div>`;
  }

  return `<div class="q-card ${statusClass}" id="qc-${idx}">
    <div class="q-hdr" onclick="toggleCard(${idx})">
      <div class="q-num">${q.origIdx+1}</div>
      <div class="q-text-preview">${qText}</div>
      <div class="q-badge">${badge}</div>
    </div>
    <div class="q-body">
      <div class="q-full-text">${qText}</div>
      ${body}
    </div>
  </div>`;
}

function toggleCard(idx){
  const el=document.getElementById('qc-'+idx);
  if(el) el.classList.toggle('open');
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtTime(s){
  s=s||0;
  const m=Math.floor(s/60);const ss=String(s%60).padStart(2,'0');
  return m+'d '+ss+'s';
}

// ── MAIN: Get data from URL params ──────────────────
// Format: ?result=BASE64_JSON or Telegram sends via initData
(async function init(){
  const params=new URLSearchParams(location.search);
  let resultData=null;

  // 1. Try URL param (base64 encoded JSON)
  const raw=params.get('result');
  if(raw){
    try{resultData=JSON.parse(atob(decodeURIComponent(raw)));}
    catch(e){console.warn('parse err',e);}
  }

  // 2. Try Telegram WebApp initDataUnsafe
  if(!resultData&&tg&&tg.initDataUnsafe?.start_param){
    try{resultData=JSON.parse(atob(tg.initDataUnsafe.start_param));}
    catch(e){}
  }

  // 3. Demo data for testing
  if(!resultData){
    resultData={
      title:"Demo Test",
      score:75,
      correct:6,
      total:8,
      passed:true,
      elapsed:125,
      questions:[
        {origIdx:0,text:"1+1 nechaga teng?",status:"correct",userAnswer:"2",correctAnswer:"2",pts:1,explanation:"Oddiy qo'shish amali"},
        {origIdx:1,text:"O'zbekistonning poytaxti qaysi shahar?",status:"correct",userAnswer:"Toshkent",correctAnswer:"Toshkent",pts:1},
        {origIdx:2,text:"Dunyo necha qismdan iborat?",status:"wrong",userAnswer:"5",correctAnswer:"6",pts:0,explanation:"Dunyo 6 ta qit'adan iborat"},
        {origIdx:3,text:"Quyosh sistemasidagi eng katta sayyora?",status:"skip",correctAnswer:"Yupiter",pts:0},
      ]
    };
  }

  showResult(resultData);
})();

function showResult(data){
  const {title,score,correct,total,passed,elapsed,questions}=data;
  const pct=score||Math.round((correct||0)/(total||1)*100);

  // Hero
  document.getElementById('hero').style.display='block';
  document.getElementById('filter-wrap').style.display='flex';
  const circle=document.getElementById('sc-circle');
  circle.textContent=pct+'%';
  circle.className='sc-circle '+(passed?'pass':'fail');
  document.getElementById('hero-title').textContent=title||'Test natijasi';
  document.getElementById('hero-sub').textContent=passed?'🎉 Muvaffaqiyatli bajardingiz!':'😔 Muvaffaqiyatsiz. Yana urinib ko\'ring!';
  document.getElementById('st-correct').textContent=(correct||0)+' ta';
  document.getElementById('st-wrong').textContent=((total||0)-(correct||0))+' ta';
  document.getElementById('st-time').textContent=fmtTime(elapsed);
  setTimeout(()=>{document.getElementById('prog-fill').style.width=pct+'%';},100);

  // Questions
  ALL_Q=questions||[];
  renderList();
}

// ── EXTERNAL INIT (called from Streamlit/bot) ──────
window.initReview=function(data){showResult(data);};
</script>
</body>
</html>
